name: Build and Deploy

on:
  push:
    branches: [ main, dev ]

jobs:
  build-and-push:
    runs-on: [self-hosted, k3s]
    permissions:
      contents: write
    env:
      ENV: ${{ github.ref_name == 'main' && 'production' || github.ref_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: artemdevopscom/currency-converter:${{ github.sha }}

      - name: Update image tag in Kustomize manifests
        run: |
          MANIFEST_PATH="deploy/kubernetes/overlays/${{ env.ENV }}/deployment-patch.yaml"
          echo "Updating manifest: $MANIFEST_PATH"
          sed -i "s|artemdevopscom/currency-converter:.*|artemdevopscom/currency-converter:${{ github.sha }}|g" $MANIFEST_PATH 

      - name: Commit and push changes back to repo
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          MANIFEST_PATH="deploy/kubernetes/overlays/${{ env.ENV }}/deployment-patch.yaml"
          git add $MANIFEST_PATH
          git commit -m "Update image tag to ${{ github.sha }} for ${{ env.ENV }}"
          git push
