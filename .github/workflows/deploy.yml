name: Build and Deploy

on:
  push:
    branches: [ main, dev ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: artemdevopscom/currency-converter:${{ github.sha }}

      - name: Update image tag in Kustomize manifests
        run: |
          # Обновляем тег образа в Kustomize overlays
          sed -i "s|artemdevopscom/currency-converter:.*|artemdevopscom/currency-converter:${{ github.sha }}|g" deploy/kubernetes/overlays/*/deployment-patch.yaml

      - name: Commit and push changes back to repo
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add deploy/kubernetes/overlays/*/deployment-patch.yaml
          git commit -m "Update image tag to ${{ github.sha }}"
          git push
