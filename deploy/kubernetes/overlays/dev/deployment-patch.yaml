apiVersion: apps/v1
kind: Deployment
metadata:
  name: currency-converter
spec:
  replicas: 1
  template:
    spec:
      containers:
      - name: app
        image: artemdevopscom/currency-converter:0aa7fc3bb84f3af8808e1eea998177478c3eded9
        env:
        - name: APP_ENV
          value: "development"
        - name: GUNICORN_WORKERS
          value: "1"
