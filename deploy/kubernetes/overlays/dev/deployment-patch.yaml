apiVersion: apps/v1
kind: Deployment
metadata:
  name: currency-converter
spec:
  replicas: 1
  template:
    spec:
      containers:
      - name: app
        image: artemdevopscom/currency-converter:9ff8e6681bb5c4c4239578c4261cd83b5093936a
        env:
        - name: APP_ENV
          value: "development"
        - name: GUNICORN_WORKERS
          value: "1"
