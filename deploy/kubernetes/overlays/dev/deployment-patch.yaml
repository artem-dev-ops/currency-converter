apiVersion: apps/v1
kind: Deployment
metadata:
  name: currency-converter
spec:
  replicas: 1
  template:
    spec:
      containers:
      - name: app
        image: artemdevopscom/currency-converter:9220fccb8c6a84a395a68e6ab3850f5a4cc10787
        env:
        - name: APP_ENV
          value: "development"
        - name: GUNICORN_WORKERS
          value: "1"
