apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dev

resources:
  - ../../base

patches:
  - path: deployment-patch.yaml
    target:
      kind: Deployment
      name: currency-converter
  - path: ingress-patch.yaml
    target:
      kind: Ingress
      name: currency-converter
