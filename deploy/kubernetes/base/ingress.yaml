apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: currency-converter
  annotations:
    kubernetes.io/ingress.class: traefik
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
  - hosts:
    - "{{ .Host }}"
    secretName: currency-converter-tls
  rules:
  - host: "{{ .Host }}"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: currency-converter
            port:
              number: 80
